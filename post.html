<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帖子详情 · ThesisHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ====== 导航栏 ====== -->
    <header class="navbar">
        <div class="container nav-inner">
            <a href="index.html" class="logo">
                <span class="logo-icon">◈</span>
                <span>Thesis<span class="fw-300">Hub</span></span>
            </a>
            <nav class="nav-links">
                <a href="index.html">首页</a>
                <a href="explore.html">探索</a>
                <a href="topics.html">话题</a>
                <a href="about.html">关于</a>
            </nav>
            <div class="nav-actions">
                <a href="login.html" class="btn btn-ghost">登录</a>
                <a href="publish.html" class="btn btn-primary">发布帖子</a>
            </div>
            <button class="mobile-menu-btn">☰</button>
        </div>
    </header>

    <!-- ====== 帖子头部 ====== -->
    <section class="post-detail-header">
        <div class="container" id="postHeader">
            <div style="text-align:center;padding:40px;color:var(--text-tertiary)">加载中...</div>
        </div>
    </section>

    <!-- ====== 帖子正文 ====== -->
    <section class="post-detail-body">
        <div class="container" id="postBody">
            <div class="card" id="postContent">
                <div style="text-align:center;padding:40px;color:var(--text-tertiary)">加载中...</div>
            </div>

            <!-- ====== 评论区 ====== -->
            <section class="comments-section" id="commentsSection">
                <h2>💬 评论 <span id="commentCount">0</span></h2>

                <!-- 评论编辑器 -->
                <div class="comment-editor" id="commentEditor">
                    <div class="avatar" style="background: linear-gradient(135deg, #6366f1, #818cf8)">?</div>
                    <div class="comment-input-wrap">
                        <input type="text" id="commentInput" placeholder="写下你的评论..." />
                        <button class="btn btn-primary btn-sm" id="commentSubmit">发表评论</button>
                    </div>
                </div>

                <div id="commentsContainer">
                    <div style="text-align:center;padding:20px;color:var(--text-tertiary)">加载中...</div>
                </div>
            </section>
        </div>
    </section>

    <!-- ====== 底部 ====== -->
    <footer class="footer">
        <div class="container footer-inner">
            <div class="footer-brand">
                <span class="logo-icon">◈</span>
                <span>ThesisHub</span>
                <p class="footer-motto">学术路上，你不是一个人在战斗</p>
            </div>
            <div class="footer-links">
                <div class="footer-col">
                    <h4>平台</h4>
                    <a href="about.html">关于我们</a>
                    <a href="explore.html">使用指南</a>
                    <a href="#">社区规范</a>
                </div>
                <div class="footer-col">
                    <h4>资源</h4>
                    <a href="explore.html">学术工具</a>
                    <a href="topics.html">热门话题</a>
                    <a href="templates.html">论文模板</a>
                </div>
                <div class="footer-col">
                    <h4>联系</h4>
                    <a href="about.html">意见反馈</a>
                    <a href="about.html">合作邮箱</a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
        </div>
    </footer>

    <!-- 回到顶部 -->
    <button class="back-to-top">↑</button>

    <!-- ====== 移动端抽屉 ====== -->
    <div class="mobile-drawer-overlay"></div>
    <div class="mobile-drawer">
        <div class="mobile-drawer-header">
            <span class="logo"><span class="logo-icon">◈</span> ThesisHub</span>
            <button class="mobile-drawer-close">✕</button>
        </div>
        <div class="drawer-user">
            <div class="avatar" style="background: linear-gradient(135deg, #6366f1, #818cf8)">?</div>
            <div class="drawer-username">未登录</div>
            <a href="login.html" class="btn btn-primary btn-sm" style="margin-top:12px;display:inline-flex">登录 / 注册</a>
        </div>
        <div class="drawer-links" style="margin-top:16px">
            <a href="index.html" class="drawer-link">🏠 首页</a>
            <a href="explore.html" class="drawer-link">🔍 探索</a>
            <a href="topics.html" class="drawer-link">📌 话题</a>
            <a href="about.html" class="drawer-link">ℹ️ 关于</a>
            <hr style="border-color:var(--border);margin:12px 0">
            <a href="templates.html" class="drawer-link">📄 论文模板</a>
            <hr style="border-color:var(--border);margin:12px 0">
            <a href="publish.html" class="drawer-link">✍️ 发布帖子</a>
            <a href="login.html" class="drawer-link">🔐 登录</a>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
    <script>
    // =============================================
    // 帖子详情页脚本
    // =============================================

    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('id');
    let currentPost = null;

    if (!postId) {
        document.getElementById('postHeader').innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">🔍</div>
                <h3>帖子不存在</h3>
                <p>请从首页选择一个帖子查看</p>
                <a href="index.html" class="btn btn-primary">返回首页</a>
            </div>
        `;
        document.getElementById('postContent').innerHTML = '';
        document.getElementById('commentsSection').style.display = 'none';
    } else {
        loadPost();
    }

    function loadPost() {
        const post = Posts.getById(postId);
        if (!post) {
            document.getElementById('postHeader').innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">😕</div>
                    <h3>帖子不存在或已被删除</h3>
                    <a href="index.html" class="btn btn-primary">返回首页</a>
                </div>
            `;
            return;
        }
        currentPost = post;

        // 渲染头部信息
        const tagsHTML = (post.tags || []).map(t => {
            const tagClass = t.includes('数据分析') ? 'tag-purple'
                : t.includes('写作') ? 'tag-green'
                : t.includes('求助') ? 'tag-blue'
                : t.includes('答辩') ? 'tag-orange'
                : t.includes('AI') ? 'tag-pink'
                : t.includes('热门') ? 'tag-hot'
                : 'tag-blue';
            return `<span class="tag ${tagClass}">${t}</span>`;
        }).join('');

        const authorColor = Auth.avatarColor(post.authorName);
        const authorChar = Auth.avatarChar(post.authorName);

        document.getElementById('postHeader').innerHTML = `
            <div class="post-tags">${tagsHTML}</div>
            <h1>${post.title}</h1>
            <div class="post-detail-meta">
                <div class="post-author">
                    <div class="avatar" style="background: ${authorColor}">${authorChar}</div>
                    <div class="author-info">
                        <span class="author-name">${post.authorName}</span>
                        <span class="author-title">· ${post.authorTitle || '学者'}</span>
                    </div>
                </div>
                <span>🕐 ${DB.timeAgo(post.createdAt)}</span>
                <span>💬 ${post.commentCount || 0} 回复</span>
                <span>👁️ ${DB.formatNum(post.views || 0)} 浏览</span>
            </div>
        `;

        // 更新页面标题
        document.title = `${post.title} · ThesisHub`;

        // 渲染正文
        const contentHTML = (post.content || post.desc || '').split('\n').map(line => {
            if (line.startsWith('### ')) return `<h3>${line.slice(4)}</h3>`;
            if (line.startsWith('## ')) return `<h2>${line.slice(3)}</h2>`;
            if (line.startsWith('# ')) return `<h1>${line.slice(2)}</h1>`;
            if (line.startsWith('> ')) return `<blockquote><p>${line.slice(2)}</p></blockquote>`;
            if (line.startsWith('- ')) return `<li>${line.slice(2)}</li>`;
            if (line.startsWith('|') && line.endsWith('|')) {
                const cells = line.split('|').filter(c => c.trim());
                if (cells.every(c => /^[-:\s]+$/.test(c))) return '</tbody><tbody>';
                const tag = line.includes('---') ? 'th' : 'td';
                return `<tr>${cells.map(c => `<${tag}>${c.trim()}</${tag}>`).join('')}</tr>`;
            }
            if (line.startsWith('|')) return '';
            if (line.trim() === '') return '<br>';
            return `<p>${line}</p>`;
        }).join('');

        document.getElementById('postContent').innerHTML = `
            <div class="markdown-content">
                ${contentHTML}
            </div>
        `;

        // 渲染评论
        renderComments();
    }

    function renderComments() {
        const comments = Comments.byPost(postId);
        document.getElementById('commentCount').textContent = comments.length;

        const container = document.getElementById('commentsContainer');
        if (comments.length === 0) {
            container.innerHTML = `
                <div class="empty-state" style="padding:30px">
                    <div class="empty-icon">💬</div>
                    <h3 style="font-size:16px">还没有评论</h3>
                    <p style="font-size:14px">来发表第一条评论吧！</p>
                </div>
            `;
            return;
        }

        container.innerHTML = comments.map(c => {
            const color = Auth.avatarColor(c.authorName);
            const char = Auth.avatarChar(c.authorName);
            return `
                <div class="comment-card">
                    <div class="avatar avatar-sm" style="background: ${color}">${char}</div>
                    <div class="comment-body">
                        <div class="comment-header">
                            <span class="comment-author">${c.authorName}</span>
                            <span class="comment-time">${DB.timeAgo(c.createdAt)}</span>
                        </div>
                        <div class="comment-text">${c.content}</div>
                    </div>
                </div>
            `;
        }).join('');
    }

    // 发表评论
    document.getElementById('commentSubmit')?.addEventListener('click', function() {
        const input = document.getElementById('commentInput');
        const content = input.value.trim();
        if (!content) {
            showToast('请输入评论内容', 'info');
            return;
        }

        if (!Auth.isLoggedIn()) {
            showToast('请先登录后发表评论', 'error');
            return;
        }

        const user = Auth.currentUser();
        Comments.add({
            postId,
            authorId: user.id,
            authorName: user.username,
            content
        });

        input.value = '';
        showToast('评论发表成功', 'success');
        renderComments();
    });

    // 回车发表评论
    document.getElementById('commentInput')?.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            document.getElementById('commentSubmit')?.click();
        }
    });
    </script>
</body>
</html>
