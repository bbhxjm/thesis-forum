    <script>
    // =============================================
    // 话题页脚本 — 统计每个话题的帖子数
    // =============================================

    const topics = [
        { icon: '📖', name: '论文求助', desc: '论文写作中遇到的各种问题求助' },
        { icon: '✍️', name: '写作经验', desc: '论文写作技巧、经验分享和心得' },
        { icon: '📊', name: '数据分析', desc: 'SPSS、R、Python 等数据分析工具讨论' },
        { icon: '📚', name: '文献综述', desc: '文献检索、管理、综述写作方法' },
        { icon: '🧪', name: '实验方法', desc: '实验设计、方法论和研究技术' },
        { icon: '🎤', name: '答辩经验', desc: '论文答辩技巧、PPT 制作和演讲经验' },
        { icon: '📰', name: '期刊投稿', desc: '期刊选择、投稿流程和审稿经验' },
        { icon: '🤖', name: 'AI 学术', desc: 'AI 工具辅助学术研究的经验与讨论' }
    ];

    function countTagPosts(tagName) {
        return Posts.all().filter(p => p.tags && p.tags.some(t => t.includes(tagName))).length;
    }

    const container = document.getElementById('topicsContainer');
    container.innerHTML = topics.map(t => {
        const count = countTagPosts(t.name);
        return `
            <a href="index.html?search=${encodeURIComponent(t.name)}" class="topic-card">
                <div class="topic-card-icon">${t.icon}</div>
                <div class="topic-card-content">
                    <h3>${t.name}</h3>
                    <p>${t.desc}</p>
                </div>
                <div class="topic-card-count">${count} 个讨论 →</div>
            </a>
        `;
    }).join('');
    </script>
