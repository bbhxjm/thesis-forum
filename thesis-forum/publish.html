<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布帖子 · ThesisHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ====== 导航栏 ====== -->
    <header class="navbar">
        <div class="container nav-inner">
            <a href="index.html" class="logo">
                <span class="logo-icon">◈</span>
                <span>Thesis<span class="fw-300">Hub</span></span>
            </a>
            <nav class="nav-links">
                <a href="index.html">首页</a>
                <a href="explore.html">探索</a>
                <a href="topics.html">话题</a>
                <a href="about.html">关于</a>
            </nav>
            <div class="nav-actions">
                <a href="login.html" class="btn btn-ghost">登录</a>
                <a href="publish.html" class="btn btn-primary">发布帖子</a>
            </div>
            <button class="mobile-menu-btn">☰</button>
        </div>
    </header>

    <!-- ====== 发布页面 ====== -->
    <section class="publish-page">
        <div class="container publish-card">
            <div class="card">
                <h1>✍️ 发布新帖</h1>

                <form id="publishForm" autocomplete="off">
                    <div class="form-group">
                        <label class="form-label">标题 <span style="color:var(--red)">*</span></label>
                        <input class="form-input" id="postTitle" type="text" placeholder="简明扼要地描述你的问题或分享" required />
                        <div class="form-hint">好标题更容易吸引人回复，如 "结构方程模型样本量不够怎么办？"</div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">内容 <span style="color:var(--red)">*</span></label>
                        <textarea class="form-textarea" id="postContent" rows="12" placeholder="详细描述你的问题或分享你的经验

支持 Markdown 格式：
## 标题
- 列表项
> 引用
**加粗**</textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">简要描述 <span style="color:var(--text-tertiary)">（选填，会显示在卡片上）</span></label>
                        <input class="form-input" id="postDesc" type="text" placeholder="用一句话概括你的帖子内容" />
                    </div>

                    <div class="form-group">
                        <label class="form-label">话题分类 <span style="color:var(--red)">*</span> <span style="font-weight:400;color:var(--text-tertiary)">（可多选）</span></label>
                        <div class="tag-picker" id="tagPicker">
                            <button type="button" class="tag-option" data-tag="📖 论文求助">📖 论文求助</button>
                            <button type="button" class="tag-option" data-tag="✍️ 写作经验">✍️ 写作经验</button>
                            <button type="button" class="tag-option" data-tag="📊 数据分析">📊 数据分析</button>
                            <button type="button" class="tag-option" data-tag="📚 文献综述">📚 文献综述</button>
                            <button type="button" class="tag-option" data-tag="🧪 实验方法">🧪 实验方法</button>
                            <button type="button" class="tag-option" data-tag="🎤 答辩经验">🎤 答辩经验</button>
                            <button type="button" class="tag-option" data-tag="📰 期刊投稿">📰 期刊投稿</button>
                            <button type="button" class="tag-option" data-tag="🤖 AI 学术">🤖 AI 学术</button>
                        </div>
                    </div>

                    <div class="form-error" id="publishError" style="display:none"></div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg">🚀 发布帖子</button>
                </form>
            </div>
        </div>
    </section>

    <!-- ====== 底部 ====== -->
    <footer class="footer">
        <div class="container footer-inner">
            <div class="footer-brand">
                <span class="logo-icon">◈</span>
                <span>ThesisHub</span>
                <p class="footer-motto">学术路上，你不是一个人在战斗</p>
            </div>
            <div class="footer-links">
                <div class="footer-col">
                    <h4>平台</h4>
                    <a href="about.html">关于我们</a>
                    <a href="explore.html">使用指南</a>
                    <a href="#">社区规范</a>
                </div>
                <div class="footer-col">
                    <h4>资源</h4>
                    <a href="explore.html">学术工具</a>
                    <a href="topics.html">热门话题</a>
                    <a href="#">模板下载</a>
                </div>
                <div class="footer-col">
                    <h4>联系</h4>
                    <a href="about.html">意见反馈</a>
                    <a href="about.html">合作邮箱</a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>Made with ❤️ · 免费开源 · 一键部署</p>
        </div>
    </footer>

    <script src="data.js"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
    <script>
    // =============================================
    // 发布页脚本
    // =============================================

    // 未登录跳转
    if (!Auth.isLoggedIn()) {
        window.location.href = 'login.html?redirect=publish.html';
    }

    // 标签选择
    const selectedTags = new Set();
    document.querySelectorAll('.tag-option').forEach(btn => {
        btn.addEventListener('click', () => {
            const tag = btn.dataset.tag;
            if (selectedTags.has(tag)) {
                selectedTags.delete(tag);
                btn.classList.remove('selected');
            } else {
                selectedTags.add(tag);
                btn.classList.add('selected');
            }
        });
    });

    // 提交
    document.getElementById('publishForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const title = document.getElementById('postTitle').value.trim();
        const content = document.getElementById('postContent').value.trim();
        const desc = document.getElementById('postDesc').value.trim();
        const errorEl = document.getElementById('publishError');
        errorEl.style.display = 'none';

        if (!title) {
            errorEl.textContent = '请输入标题';
            errorEl.style.display = 'block';
            return;
        }
        if (!content) {
            errorEl.textContent = '请输入内容';
            errorEl.style.display = 'block';
            return;
        }
        if (selectedTags.size === 0) {
            errorEl.textContent = '请至少选择一个话题分类';
            errorEl.style.display = 'block';
            return;
        }

        const user = Auth.currentUser();
        const post = Posts.create({
            title,
            content,
            desc: desc || title.slice(0, 120),
            tags: Array.from(selectedTags),
            authorId: user.id,
            authorName: user.username,
            authorTitle: user.title || '学者'
        });

        showToast('🎉 发布成功！', 'success');
        setTimeout(() => {
            window.location.href = `post.html?id=${post.id}`;
        }, 300);
    });
    </script>
</body>
</html>
