<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户主页 · ThesisHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ====== 导航栏 ====== -->
    <header class="navbar">
        <div class="container nav-inner">
            <a href="index.html" class="logo">
                <span class="logo-icon">◈</span>
                <span>Thesis<span class="fw-300">Hub</span></span>
            </a>
            <nav class="nav-links">
                <a href="index.html">首页</a>
                <a href="explore.html">探索</a>
                <a href="topics.html">话题</a>
                <a href="about.html">关于</a>
            </nav>
            <div class="nav-actions">
                <a href="login.html" class="btn btn-ghost">登录</a>
                <a href="publish.html" class="btn btn-primary">发布帖子</a>
            </div>
            <button class="mobile-menu-btn">☰</button>
        </div>
    </header>

    <!-- ====== 用户信息 ====== -->
    <section class="page-header">
        <div class="container page-header-content" id="profileSection">
            <div style="text-align:center;padding:40px;color:var(--text-tertiary)">加载中...</div>
        </div>
    </section>

    <!-- ====== 用户帖子 ====== -->
    <section class="container posts-section">
        <div class="profile-tabs">
            <button class="profile-tab active" data-tab="posts">发布的帖子</button>
            <button class="profile-tab" data-tab="about">个人简介</button>
        </div>

        <div id="profilePosts" style="padding-top:20px">
            <!-- 由 JS 渲染 -->
        </div>

        <div id="profileAbout" style="display:none;padding-top:20px">
            <!-- 由 JS 渲染 -->
        </div>
    </section>

    <!-- ====== 底部 ====== -->
    <footer class="footer">
        <div class="container footer-inner">
            <div class="footer-brand">
                <span class="logo-icon">◈</span>
                <span>ThesisHub</span>
                <p class="footer-motto">学术路上，你不是一个人在战斗</p>
            </div>
            <div class="footer-links">
                <div class="footer-col">
                    <h4>平台</h4>
                    <a href="about.html">关于我们</a>
                    <a href="explore.html">使用指南</a>
                    <a href="#">社区规范</a>
                </div>
                <div class="footer-col">
                    <h4>资源</h4>
                    <a href="explore.html">学术工具</a>
                    <a href="topics.html">热门话题</a>
                    <a href="templates.html">论文模板</a>
                </div>
                <div class="footer-col">
                    <h4>联系</h4>
                    <a href="about.html">意见反馈</a>
                    <a href="about.html">合作邮箱</a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
        </div>
    </footer>

    <!-- 回到顶部 -->
    <button class="back-to-top">↑</button>

    <!-- ====== 移动端抽屉 ====== -->
    <div class="mobile-drawer-overlay"></div>
    <div class="mobile-drawer">
        <div class="mobile-drawer-header">
            <span class="logo"><span class="logo-icon">◈</span> ThesisHub</span>
            <button class="mobile-drawer-close">✕</button>
        </div>
        <div class="drawer-user">
            <div class="avatar" style="background: linear-gradient(135deg, #6366f1, #818cf8)">?</div>
            <div class="drawer-username">未登录</div>
            <a href="login.html" class="btn btn-primary btn-sm" style="margin-top:12px;display:inline-flex">登录 / 注册</a>
        </div>
        <div class="drawer-links" style="margin-top:16px">
            <a href="index.html" class="drawer-link">🏠 首页</a>
            <a href="explore.html" class="drawer-link">🔍 探索</a>
            <a href="topics.html" class="drawer-link">📌 话题</a>
            <a href="about.html" class="drawer-link">ℹ️ 关于</a>
            <hr style="border-color:var(--border);margin:12px 0">
            <a href="templates.html" class="drawer-link">📄 论文模板</a>
            <hr style="border-color:var(--border);margin:12px 0">
            <a href="publish.html" class="drawer-link">✍️ 发布帖子</a>
            <a href="login.html" class="drawer-link">🔐 登录</a>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
    <script>
    // =============================================
    // 用户主页脚本
    // =============================================

    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('id') || (Auth.currentUser() ? Auth.currentUser().id : null);

    if (!userId) {
        document.getElementById('profileSection').innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">👤</div>
                <h3>用户未指定</h3>
                <p>请从帖子中点击用户头像查看</p>
                <a href="index.html" class="btn btn-primary">返回首页</a>
            </div>
        `;
        document.querySelector('.posts-section').style.display = 'none';
    } else {
        loadProfile();
    }

    function loadProfile() {
        const profile = Auth.getProfile(userId);
        if (!profile) {
            document.getElementById('profileSection').innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">😕</div>
                    <h3>用户不存在</h3>
                    <a href="index.html" class="btn btn-primary">返回首页</a>
                </div>
            `;
            return;
        }

        const color = Auth.avatarColor(profile.username);
        const char = Auth.avatarChar(profile.username);
        const isMe = Auth.currentUser() && Auth.currentUser().id === userId;

        document.title = `${profile.username} 的主页 · ThesisHub`;

        document.getElementById('profileSection').innerHTML = `
            <div class="profile-header">
                <div class="profile-avatar">
                    <div class="avatar avatar-xl" style="background: ${color}">${char}</div>
                </div>
                <div class="profile-info">
                    <h1>${profile.username}</h1>
                    <div class="profile-title">${profile.title || '学者'}</div>
                    <div class="profile-bio">${profile.bio || '这个用户很懒，还没有填写简介'}</div>
                    <div class="profile-meta">
                        <span>📅 ${new Date(profile.createdAt).toLocaleDateString('zh-CN')} 加入</span>
                        ${isMe ? `<span>📧 ${profile.email}</span>` : ''}
                    </div>
                    <div class="profile-stats">
                        <div class="profile-stat">
                            <div class="profile-stat-num">${profile.postCount}</div>
                            <div class="profile-stat-label">帖子</div>
                        </div>
                        <div class="profile-stat">
                            <div class="profile-stat-num">${DB.formatNum(profile.totalVotes)}</div>
                            <div class="profile-stat-label">获赞</div>
                        </div>
                        <div class="profile-stat">
                            <div class="profile-stat-num">${DB.formatNum(profile.totalViews)}</div>
                            <div class="profile-stat-label">浏览</div>
                        </div>
                    </div>
                    ${isMe ? '<button class="btn btn-ghost btn-sm" style="margin-top:16px" id="editProfileBtn">✏️ 编辑资料</button>' : ''}
                </div>
            </div>
        `;

        // Tab 切换
        document.querySelectorAll('.profile-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.profile-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const t = tab.dataset.tab;
                document.getElementById('profilePosts').style.display = t === 'posts' ? 'block' : 'none';
                document.getElementById('profileAbout').style.display = t === 'about' ? 'block' : 'none';
            });
        });

        // 帖子列表
        renderProfilePosts(profile.posts);

        // 关于
        document.getElementById('profileAbout').innerHTML = `
            <div class="card">
                <h3 style="font-weight:600;margin-bottom:12px">关于 ${profile.username}</h3>
                <p style="color:var(--text-secondary);line-height:1.8">${profile.bio || '这个用户很懒，还没有填写简介'}</p>
                <hr style="border-color:var(--border);margin:20px 0">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px;color:var(--text-secondary)">
                    <div><strong style="color:var(--text-primary)">身份</strong><br>${profile.title || '未设置'}</div>
                    <div><strong style="color:var(--text-primary)">加入时间</strong><br>${new Date(profile.createdAt).toLocaleDateString('zh-CN')}</div>
                    <div><strong style="color:var(--text-primary)">发帖数</strong><br>${profile.postCount}</div>
                    <div><strong style="color:var(--text-primary)">总获赞</strong><br>${DB.formatNum(profile.totalVotes)}</div>
                </div>
            </div>
        `;

        // 编辑资料（仅自己）
        const editBtn = document.getElementById('editProfileBtn');
        if (editBtn) {
            editBtn.addEventListener('click', () => {
                const newTitle = prompt('修改身份（如：博士二年级）', profile.title || '');
                if (newTitle === null) return;
                const newBio = prompt('修改简介', profile.bio || '');
                if (newBio === null) return;

                Auth.updateProfile({ title: newTitle, bio: newBio });
                showToast('资料更新成功', 'success');
                setTimeout(() => location.reload(), 300);
            });
        }
    }

    function renderProfilePosts(posts) {
        const container = document.getElementById('profilePosts');
        if (!posts || posts.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <h3>还没有发布帖子</h3>
                    <a href="publish.html" class="btn btn-primary">发布第一篇帖子</a>
                </div>
            `;
            return;
        }

        container.innerHTML = posts.map((post, i) => {
            const tagsHTML = (post.tags || []).map(t => {
                const cls = t.includes('数据分析') ? 'tag-purple'
                    : t.includes('写作') ? 'tag-green'
                    : t.includes('求助') ? 'tag-blue'
                    : t.includes('答辩') ? 'tag-orange'
                    : t.includes('AI') ? 'tag-pink'
                    : 'tag-blue';
                return `<span class="tag ${cls}">${t}</span>`;
            }).join('');

            return `
                <article class="post-card" data-post-id="${post.id}" data-author-id="${post.authorId}" style="--order: ${i + 1}">
                    <div class="vote-box">
                        <button class="vote-btn up">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="18 15 12 9 6 15"/></svg>
                        </button>
                        <span class="vote-num">${DB.formatNum(post.votes || 0)}</span>
                        <button class="vote-btn down">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                    </div>
                    <div class="post-content">
                        <div class="post-tags">${tagsHTML}</div>
                        <h3 class="post-title">${post.title}</h3>
                        <p class="post-desc">${post.desc || ''}</p>
                        <div class="post-footer">
                            <div></div>
                            <div class="post-meta-stats">
                                <span>💬 ${post.commentCount || 0} 回复</span>
                                <span>👁️ ${DB.formatNum(post.views || 0)} 浏览</span>
                                <span>🕐 ${DB.timeAgo(post.createdAt)}</span>
                            </div>
                        </div>
                    </div>
                </article>
            `;
        }).join('');
    }
    </script>
</body>
</html>
